name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development and signal dependencies
        run: python -m pip install -e ".[dev,signal]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
